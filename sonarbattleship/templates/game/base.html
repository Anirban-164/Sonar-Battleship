<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sonar Battleship{% endblock %}</title>
    {% load static %}

    <!-- Military typeface pair: stencilled hull markings for headings,
         a technical monospace for every instrument readout. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Stardos+Stencil:wght@400;700&family=Share+Tech+Mono&family=Saira+Condensed:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- ?v= is a cache buster. Django's dev server serves static files with
         a Last-Modified header that browsers happily hold on to, so an
         edited stylesheet can keep serving the old bytes until a hard
         refresh — which looks exactly like the new CSS "not working".
         Bump this string whenever style.css changes. -->
    <link rel="stylesheet" href="{% static 'game/style.css' %}?v=0.7.1">
    {% block head %}{% endblock %}
</head>
<body>
    <div id="app">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
