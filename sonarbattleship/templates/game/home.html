{% extends "game/base.html" %}
{% load static %}
{% block title %}Sonar Battleship — Home{% endblock %}

{% block content %}
<!-- Landing Page -->
<div id="landing-page" style="display: flex; justify-content: center; padding: 20px;">
    <div style="position: relative; display: inline-block; max-width: 1367px; width: 100%;">
        <img src="{% static 'game/images/main_menu.png' %}" style="width: 100%; display: block; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);" alt="Main Menu">
        <!-- Play Now Button Overlay (Calculated from coordinates: 70,465 to 521,518 on 1367x768 image) -->
        <div onclick="showRoomCreation()" 
             style="position: absolute; left: 5.12%; top: 60.55%; width: 32.99%; height: 6.90%; cursor: pointer;" 
             title="Play Now">
        </div>
    </div>
</div>

<!-- Room Creation (Initially Hidden) -->
<div class="home-container" id="room-creation-container" style="display:none;">
    <h1>Sonar Battleship</h1>
    <p class="subtitle">A DSP-powered naval warfare game</p>

    {% if error %}
    <div class="error-banner">{{ error }}</div>
    {% endif %}

    <div class="home-panels">
        <!-- Create Room -->
        <div class="panel">
            <h2>Create a Room</h2>
            <input type="text" id="create-name" placeholder="Your name" maxlength="30">
            <button id="btn-create" onclick="createRoom()">Create Room</button>
        </div>

        <!-- Join Room -->
        <div class="panel">
            <h2>Join a Room</h2>
            <input type="text" id="join-name" placeholder="Your name" maxlength="30">
            <input type="text" id="join-code" placeholder="Room code" maxlength="6"
                   style="text-transform: uppercase;">
            <button id="btn-join" onclick="joinRoom()">Join Room</button>
        </div>
    </div>

    <div id="home-error" class="error-text" style="display:none;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function showRoomCreation() {
        document.getElementById('landing-page').style.display = 'none';
        document.getElementById('room-creation-container').style.display = 'block';
    }

    async function createRoom() {
        const name = document.getElementById('create-name').value.trim() || 'Player 1';
        const res = await fetch('/api/create-room/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name}),
        });
        const data = await res.json();
        if (data.room_code) {
            window.location.href = '/room/' + data.room_code + '/';
        } else {
            showError(data.error);
        }
    }

    async function joinRoom() {
        const name = document.getElementById('join-name').value.trim() || 'Player 2';
        const code = document.getElementById('join-code').value.trim().toUpperCase();
        if (!code) { showError('Enter a room code'); return; }

        const res = await fetch('/api/join-room/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, code}),
        });
        const data = await res.json();
        if (data.room_code) {
            window.location.href = '/room/' + data.room_code + '/';
        } else {
            showError(data.error);
        }
    }

    function showError(msg) {
        const el = document.getElementById('home-error');
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 4000);
    }
</script>
{% endblock %}
